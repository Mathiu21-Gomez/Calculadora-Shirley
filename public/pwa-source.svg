<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b095d2"/>
      <stop offset="50%" stop-color="#d8b6db"/>
      <stop offset="100%" stop-color="#ffb7c5"/>
    </linearGradient>
    <linearGradient id="heart-shine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#fff5f8" stop-opacity="0.85"/>
    </linearGradient>
  </defs>

  <!-- Background tile with rounded corners (safe for maskable) -->
  <rect width="512" height="512" rx="96" fill="url(#grad)"/>

  <!-- Subtle inner glow -->
  <rect x="16" y="16" width="480" height="480" rx="80" fill="none"
        stroke="rgba(255,255,255,0.18)" stroke-width="2"/>

  <!-- Romantic heart, centered, fits within maskable safe zone -->
  <path
    d="M256 408
       C 196 372, 108 302, 108 214
       C 108 162, 148 122, 200 122
       C 230 122, 252 142, 256 162
       C 260 142, 282 122, 312 122
       C 364 122, 404 162, 404 214
       C 404 302, 316 372, 256 408 Z"
    fill="url(#heart-shine)"/>

  <!-- Soft highlight on top-left of heart for depth -->
  <ellipse cx="200" cy="170" rx="32" ry="20"
           fill="rgba(255,255,255,0.55)" transform="rotate(-25 200 170)"/>
</svg>
